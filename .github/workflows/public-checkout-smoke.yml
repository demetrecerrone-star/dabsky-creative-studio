name: Verify public Dabsky payment deployment
on:
  push:
    paths:
      - ".github/workflows/public-checkout-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-latest
    steps:
      - name: Check public static site and Stripe test-mode endpoint
        env:
          SITE: https://dabskycreativestudio.netlify.app
        run: |
          node <<'JS'
          const site = process.env.SITE;
          const pause = ms => new Promise(done => setTimeout(done, ms));
          let last = '';
          for (let attempt=1; attempt<=6; attempt++) {
            try {
              const homepage = await fetch(site + '/payments.html', {signal:AbortSignal.timeout(15000)});
              const html = await homepage.text();
              if(!homepage.ok) {
                last='Payment page HTTP '+homepage.status;
              } else {
                const urls=[
                  'https://buy.stripe.com/test_bJe3cv2KD9uPgL18Uf5AQ00',
                  'https://buy.stripe.com/test_6oUbJ170TfTd52j3zV5AQ01',
                  'https://buy.stripe.com/test_28E6oH4SL4avcuL4DZ5AQ02'
                ];
                const hasFallback=urls.every(url=>html.includes(url))&&html.includes('TEST MODE ONLY');
                if(hasFallback){
                  console.log('PASS: All 3 Stripe test-mode Payment Links are present on live Netlify payments page.');
                  process.exit(0);
                }
                last='Public payment page does not yet include all sandbox checkout links.';
              }
            } catch(e) { last = String(e?.message || e); }
            console.log('Attempt',attempt,'-',last);
            if(attempt<6)await pause(10000);
          }
          console.error('Public deployment not verified:',last);
          process.exit(1);
          JS
